<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Tally</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --label: #000000;
    --label2: rgba(60,60,67,.6);
    --label3: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.18);
    --fill: rgba(118,118,128,.12);
    --blue: #007AFF;
    --red: #FF3B30;
    --green: #34C759;
    --bar: rgba(249,249,249,.82);
    --dockbg: rgba(242,242,247,.86);
    --tally: #1C1C1E;
    --sheet: #FFFFFF;
    --dim: rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1C1C1E;
      --label: #FFFFFF;
      --label2: rgba(235,235,245,.6);
      --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.6);
      --fill: rgba(118,118,128,.24);
      --blue: #0A84FF;
      --red: #FF453A;
      --green: #30D158;
      --bar: rgba(22,22,24,.82);
    --dockbg: rgba(0,0,0,.82);
      --tally: #F2F2F7;
      --sheet: #2C2C2E;
      --dim: rgba(0,0,0,.55);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: var(--bg);
    color: var(--label);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

  .app {
    max-width: 560px; margin: 0 auto;
    height: var(--app-h, 100%); overflow: hidden;
    padding: calc(env(safe-area-inset-top) + 8px) 16px 0;
    display: flex; flex-direction: column;
  }

  /* Header */
  header { flex: none; display: flex; align-items: flex-end; justify-content: space-between; padding: 8px 4px 0; }
  h1 { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .37px; margin: 0; }
  .status { flex: none; font-size: 13px; color: var(--label2); margin: 2px 4px 0; height: 18px; display: flex; align-items: center; gap: 6px; }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--label3); }
  .status.ok .dot { background: var(--green); }
  .more {
    width: 34px; height: 34px; border-radius: 50%; background: var(--fill);
    display: grid; place-items: center; margin-bottom: 4px; color: var(--blue);
  }
  .more svg { width: 18px; height: 18px; }

  /* Tabs */
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; margin: 0 -16px; padding: 14px 16px 2px;
    scroll-padding-inline: 16px; scrollbar-width: none;
    flex: none; touch-action: pan-x; overscroll-behavior: contain; position: relative;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 34px; padding: 0 16px; border-radius: 17px;
    background: var(--fill); color: var(--label);
    font-size: 15px; font-weight: 500; white-space: nowrap;
    max-width: 180px; overflow: hidden; text-overflow: ellipsis;
    transition: background .2s, color .2s, transform .1s;
  }
  .chip:active { transform: scale(.96); }
  .chip.active { background: var(--accent); color: var(--on-accent); }
  .chip.add { width: 34px; padding: 0; display: grid; place-items: center; color: var(--blue); }
  .chip.add svg { width: 16px; height: 16px; }

  /* Card */
  .card {
    background: var(--card); border-radius: 16px; margin-top: 14px; padding: 16px 16px 14px;
    flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; }
  .tab-name { font-size: 20px; font-weight: 600; letter-spacing: .38px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: 15px; color: var(--label2); flex: none; margin-left: 12px; font-variant-numeric: tabular-nums; }
  .tally {
    margin-top: 12px; flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-content: flex-start;
  }
  .tally svg { width: 52px; height: 46px; flex: none; scroll-margin: 6px; }
  .tally line { stroke: var(--tally); stroke-width: 3.2; stroke-linecap: round; }
  .tally line.new { animation: draw .28s ease-out; }
  @keyframes draw { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .empty { width: 100%; min-height: 100%; flex: 1; display: grid; place-items: center; text-align: center; color: var(--label3); font-size: 15px; }

  /* Clicker */
  .clicker-wrap { display: flex; justify-content: center; align-items: center; gap: 0; justify-content: space-evenly; padding: 12px 0; max-width: 520px; margin: 0 auto; }
  .clicker, .minus {
    width: min(118px, 31vw); height: min(118px, 31vw); border-radius: 50%; flex: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform .12s cubic-bezier(.3,.7,.4,1), box-shadow .12s, background .25s, color .25s;
  }
  .clicker {
    background: var(--green); color: #fff;
    box-shadow: 0 10px 28px rgba(52,199,89,.30), inset 0 1px 0 rgba(255,255,255,.25);
  }
  .minus {
    background: var(--fill); color: var(--red);
  }
  .clicker:active, .minus:active:not(:disabled) { transform: scale(.93); }
  .clicker:active { box-shadow: 0 4px 12px rgba(52,199,89,.30); }
  .clicker svg, .minus svg { width: 38px; height: 38px; }
  .clicker span, .minus span { font-size: 16px; font-weight: 600; opacity: .9; }
  .minus:disabled { color: var(--label3); }

  /* Farbauswahl */
  .colors { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; justify-items: center; margin-top: 18px; }
  .swatch {
    width: 40px; height: 40px; border-radius: 50%; position: relative;
    transition: transform .12s;
  }
  .swatch:active { transform: scale(.9); }
  .swatch.sel::after {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    border: 2.5px solid var(--label2);
  }
  .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }

  /* Unten fixiert: Klicker + Summe */
  .dock {
    flex: none; margin: 14px -16px 0;
    background: var(--dockbg);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
    border-top: .5px solid var(--sep);
    padding: 0 20px calc(env(safe-area-inset-bottom) + 30px);
  }
  .sumbar-inner { max-width: 520px; margin: 0 auto; border-top: .5px solid var(--sep); padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sum-label { font-size: 13px; color: var(--label2); text-transform: uppercase; letter-spacing: .3px; }
  .sum-total { font-size: 13px; color: var(--label2); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .sum-value { font-size: 34px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sum-value.bump { animation: bump .25s ease-out; }
  @keyframes bump { 40% { transform: scale(1.06); } }

  /* Sheets */
  .overlay {
    position: fixed; inset: 0; z-index: 20; background: var(--dim);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: var(--hide-b, 0px); z-index: 21;
    max-width: 560px; margin: 0 auto;
    padding: 0 10px calc(env(safe-area-inset-bottom) + 30px);
    /* Geschlossen: ganz aus dem Bild und unsichtbar, auch wenn man die Seite hochwischt */
    transform: translateY(calc(100% + var(--hide-b, 0px) + 80px));
    visibility: hidden; pointer-events: none;
    transition: transform .32s cubic-bezier(.32,.72,0,1), visibility 0s linear .32s;
  }
  .sheet.show { transform: none; visibility: visible; pointer-events: auto; transition: transform .32s cubic-bezier(.32,.72,0,1), visibility 0s; }
  .group { background: var(--sheet); border-radius: 14px; overflow: hidden; }
  .group + .group { margin-top: 8px; }
  .action {
    display: block; width: 100%; height: 57px; font-size: 20px; color: var(--blue); text-align: center;
    border-top: .5px solid var(--sep);
  }
  .action:first-child { border-top: 0; }
  .action:active { background: var(--fill); }
  .action.destructive { color: var(--red); }
  .action.bold { font-weight: 600; }
  .sheet-title { padding: 14px 16px 12px; text-align: center; font-size: 13px; color: var(--label2); border-bottom: .5px solid var(--sep); }
  .sheet-title b { display: block; font-size: 13px; font-weight: 600; margin-bottom: 2px; }

  .form { padding: 18px 16px 16px; }
  .form-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .form-head h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .form-head button { font-size: 17px; color: var(--blue); min-width: 70px; }
  .form-head button.done { font-weight: 600; text-align: right; }
  .form-head button.cancel { text-align: left; }
  .form-head button:disabled { color: var(--label3); }
  .input {
    width: 100%; height: 44px; border-radius: 10px; border: 0; outline: 0;
    background: var(--fill); color: var(--label); padding: 0 14px; font: inherit; font-size: 17px;
    -webkit-user-select: text; user-select: text;
  }
  .area { height: 112px; padding: 10px 14px; resize: none; display: block; font: 13px/1.35 ui-monospace, Menlo, monospace; word-break: break-all; }
  .hint { font-size: 13px; line-height: 1.4; color: var(--label2); margin: 10px 2px 0; }
  .hint.err { color: var(--red); }
  /* Eigenständige Version: kein Speicher-Hinweis, weniger Abstand unten */
  .status { display: none !important; }
  .dock { padding-bottom: calc(env(safe-area-inset-bottom) + 14px) !important; }
  .sheet { padding-bottom: calc(env(safe-area-inset-bottom) + 14px) !important; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Tally</h1>
    <button class="more" id="addBtn" aria-label="Tab hinzufügen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </header>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Wird geladen…</span></div>

  <nav class="tabs" id="tabs"></nav>

  <section class="card">
    <div class="card-head">
      <div class="tab-name" id="tabName"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="tally" id="tally"></div>
  </section>

<footer class="dock" id="dock">
  <div class="clicker-wrap">
    <button class="minus" id="minus" aria-label="Strich entfernen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
      <span>10 €</span>
    </button>
    <button class="clicker" id="clicker" aria-label="Strich hinzufügen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>10 €</span>
    </button>
  </div>
  <div class="sumbar-inner">
    <div>
      <div class="sum-label">Summe</div>
      <div class="sum-total" id="sumAll"></div>
    </div>
    <div class="sum-value" id="sum">0 €</div>
  </div>
</footer>
</div>


<div class="overlay" id="overlay"></div>

<!-- Aktionen -->
<div class="sheet" id="actionSheet">
  <div class="group">
    <div class="sheet-title"><b id="actionTitle"></b>Tab bearbeiten</div>
    <button class="action" data-act="rename">Name &amp; Farbe ändern</button>
    <button class="action destructive" data-act="delete">Tab löschen</button>
  </div>
  <div class="group">
    <button class="action" data-act="export">Daten exportieren</button>
    <button class="action" data-act="import">Daten importieren</button>
  </div>
  <div class="group"><button class="action bold" data-act="cancel">Abbrechen</button></div>
</div>

<!-- Bestätigen -->
<div class="sheet" id="confirmSheet">
  <div class="group">
    <div class="sheet-title" id="confirmText"></div>
    <button class="action destructive" id="confirmBtn"></button>
  </div>
  <div class="group"><button class="action bold" data-close>Abbrechen</button></div>
</div>

<!-- Daten exportieren / importieren -->
<div class="sheet" id="dataSheet">
  <div class="group">
    <div class="form">
      <div class="form-head">
        <button type="button" class="cancel" data-close>Abbrechen</button>
        <h2 id="dataTitle">Exportieren</h2>
        <button type="button" class="done" id="dataBtn">Kopieren</button>
      </div>
      <textarea class="input area" id="dataText" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off"></textarea>
      <p class="hint" id="dataHint"></p>
    </div>
  </div>
</div>

<!-- Name eingeben -->
<div class="sheet" id="nameSheet">
  <div class="group">
    <form class="form" id="nameForm" autocomplete="off">
      <div class="form-head">
        <button type="button" class="cancel" data-close>Abbrechen</button>
        <h2 id="nameTitle">Neuer Tab</h2>
        <button type="submit" class="done" id="nameDone">Fertig</button>
      </div>
      <input class="input" id="nameInput" maxlength="40" placeholder="Name" enterkeyhint="done">
      <div class="colors" id="colors"></div>
    </form>
  </div>
</div>

<script>
(function () {
  const STANDALONE = true;
  const VALUE = 10;
  const LS_KEY = "geldzaehler.v1";
  const $ = (id) => document.getElementById(id);
  const fmt = new Intl.NumberFormat("de-DE", { maximumFractionDigits: 0 });
  const euro = (n) => fmt.format(n) + " €";
  const uid = () => Math.random().toString(36).slice(2, 10);

  // Apple-Systemfarben: [hell, dunkel, Textfarbe darauf]
  const COLORS = {
    blue:   ["#007AFF", "#0A84FF", "#fff"],
    green:  ["#34C759", "#30D158", "#fff"],
    red:    ["#FF3B30", "#FF453A", "#fff"],
    orange: ["#FF9500", "#FF9F0A", "#fff"],
    yellow: ["#FFCC00", "#FFD60A", "#000"],
    pink:   ["#FF2D55", "#FF375F", "#fff"],
    purple: ["#AF52DE", "#BF5AF2", "#fff"],
    indigo: ["#5856D6", "#5E5CE6", "#fff"],
    teal:   ["#30B0C7", "#40C8E0", "#fff"],
    gray:   ["#8E8E93", "#98989D", "#fff"],
  };
  const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
  const colorOf = (key) => COLORS[key] || COLORS.blue;
  const hexOf = (key) => colorOf(key)[darkMQ.matches ? 1 : 0];
  function applyAccent(key) {
    const hex = hexOf(key), r = document.documentElement.style;
    r.setProperty("--accent", hex);
    r.setProperty("--on-accent", colorOf(key)[2]);
    r.setProperty("--accent-shadow", hex + "4D");
  }

  function defaultState() {
    const id = uid();
    return { tabs: [{ id, name: "Tab 1", count: 0 }], activeId: id, updatedAt: 0 };
  }
  function valid(s) {
    return s && Array.isArray(s.tabs) && s.tabs.length > 0 &&
      s.tabs.every(t => t && typeof t.id === "string" && typeof t.name === "string" && Number.isFinite(t.count));
  }
  function clone(s) { return JSON.parse(JSON.stringify(s)); }

  // ---------- Lokaler Speicher (sofort) ----------
  function loadLocal() {
    try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (valid(s)) return s; } catch (e) {}
    return null;
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  }

  let state = loadLocal() || defaultState();
  if (!state.tabs.some(t => t.id === state.activeId)) state.activeId = state.tabs[0].id;
  let lastAdded = -1;

  const active = () => state.tabs.find(t => t.id === state.activeId) || state.tabs[0];

  // ---------- Render ----------
  function tallyGroup(n, startIndex) {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 52 46");
    const xs = [8, 18, 28, 38];
    for (let i = 0; i < Math.min(n, 4); i++) {
      const l = document.createElementNS(ns, "line");
      l.setAttribute("x1", xs[i]); l.setAttribute("x2", xs[i]);
      l.setAttribute("y1", 5); l.setAttribute("y2", 41);
      if (startIndex + i === lastAdded) l.classList.add("new");
      svg.appendChild(l);
    }
    if (n === 5) {
      const l = document.createElementNS(ns, "line");
      l.setAttribute("x1", 2); l.setAttribute("y1", 34);
      l.setAttribute("x2", 46); l.setAttribute("y2", 12);
      if (startIndex + 4 === lastAdded) l.classList.add("new");
      svg.appendChild(l);
    }
    return svg;
  }

  function render() {
    const tab = active();

    // Tabs
    const tabsEl = $("tabs");
    tabsEl.textContent = "";
    applyAccent(tab.color);
    state.tabs.forEach(t => {
      const b = document.createElement("button");
      const isActive = t.id === tab.id;
      b.className = "chip" + (isActive ? " active" : "");
      if (!isActive) {
        const d = document.createElement("span");
        d.className = "dot";
        d.style.background = hexOf(t.color);
        b.appendChild(d);
      }
      b.appendChild(document.createTextNode(t.name));
      b.onclick = () => {
        if (t.id === state.activeId) { openActions(); return; }
        state.activeId = t.id; lastAdded = -1; commit(false);
      };
      tabsEl.appendChild(b);
    });

    // Aktiven Tab sichtbar halten (nur seitwärts scrollen)
    const act = tabsEl.querySelector(".chip.active");
    if (act) {
      const left = act.offsetLeft - 16, right = act.offsetLeft + act.offsetWidth + 16 - tabsEl.clientWidth;
      if (tabsEl.scrollLeft > left) tabsEl.scrollLeft = left;
      else if (tabsEl.scrollLeft < right) tabsEl.scrollLeft = right;
    }

    // Karte
    $("tabName").textContent = tab.name;
    $("count").textContent = tab.count === 1 ? "1 Strich" : tab.count + " Striche";
    const tally = $("tally");
    tally.textContent = "";
    if (tab.count === 0) {
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = "Noch keine Striche – tippe auf den Knopf.";
      tally.appendChild(e);
    } else {
      const full = Math.floor(tab.count / 5), rest = tab.count % 5;
      for (let g = 0; g < full; g++) tally.appendChild(tallyGroup(5, g * 5));
      if (rest) tally.appendChild(tallyGroup(rest, full * 5));
      if (lastAdded >= 0 && tally.lastElementChild) {
        tally.lastElementChild.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }
    }

    $("minus").disabled = tab.count === 0;

    // Summe
    $("sum").textContent = euro(tab.count * VALUE);
    const total = state.tabs.reduce((a, t) => a + t.count, 0) * VALUE;
    $("sumAll").textContent = state.tabs.length > 1 ? "Alle Tabs: " + euro(total) : tab.name;
  }

  function bumpSum() {
    const s = $("sum");
    s.classList.remove("bump"); void s.offsetWidth; s.classList.add("bump");
  }

  // ---------- Änderungen ----------
  function commit(changedData = true) {
    state.updatedAt = Date.now();
    saveLocal();
    render();
    scheduleRemote();
  }

  $("clicker").addEventListener("click", () => {
    const t = active();
    lastAdded = t.count;
    t.count += 1;
    commit();
    bumpSum();
  });
  $("minus").addEventListener("click", () => {
    const t = active();
    if (t.count <= 0) return;
    t.count -= 1;
    lastAdded = -1;
    commit();
    bumpSum();
  });

  // ---------- Sheets ----------
  let openSheet = null;
  function show(sheet) {
    if (openSheet) openSheet.classList.remove("show");
    openSheet = sheet;
    $("overlay").classList.add("show");
    sheet.classList.add("show");
  }
  function hide() {
    $("overlay").classList.remove("show");
    if (openSheet) openSheet.classList.remove("show");
    openSheet = null;
    $("nameInput").blur();
  }
  $("overlay").onclick = hide;
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = hide);

  function openActions() {
    $("actionTitle").textContent = active().name;
    show($("actionSheet"));
  }
  $("addBtn").onclick = () => openName("new");

  $("actionSheet").addEventListener("click", (e) => {
    const act = e.target.closest("[data-act]")?.dataset.act;
    if (!act) return;
    if (act === "cancel") return hide();
    if (act === "rename") return openName("rename");
    if (act === "export") return openData("export");
    if (act === "import") return openData("import");
    if (act === "delete") {
      return confirmAction("„" + active().name + "“ und alle Striche darin werden gelöscht.", "Tab löschen", () => {
        const i = state.tabs.findIndex(t => t.id === state.activeId);
        state.tabs.splice(i, 1);
        if (state.tabs.length === 0) { const d = defaultState().tabs[0]; state.tabs.push(d); }
        state.activeId = state.tabs[Math.max(0, i - 1)].id;
        lastAdded = -1; commit();
      });
    }
  });

  // ---------- Daten exportieren / importieren ----------
  function exportCode() {
    const json = JSON.stringify({
      tabs: state.tabs.map(t => ({ id: t.id, name: t.name, count: t.count, color: t.color || "blue" })),
      activeId: state.activeId,
    });
    return "TALLY1:" + btoa(unescape(encodeURIComponent(json)));
  }
  function parseCode(txt) {
    txt = String(txt || "").replace(/\s+/g, "");
    if (!txt.startsWith("TALLY1:")) return null;
    try {
      const d = JSON.parse(decodeURIComponent(escape(atob(txt.slice(7)))));
      return valid(d) ? d : null;
    } catch (e) { return null; }
  }
  function setHint(text, err) {
    $("dataHint").textContent = text;
    $("dataHint").classList.toggle("err", !!err);
  }
  let dataMode = "export";
  function openData(mode) {
    dataMode = mode;
    const ta = $("dataText");
    if (mode === "export") {
      $("dataTitle").textContent = "Exportieren";
      $("dataBtn").textContent = "Kopieren";
      ta.value = exportCode(); ta.readOnly = true;
      setHint("Kopiere diesen Code und füge ihn in der anderen Tally-App unter „Daten importieren“ ein.");
    } else {
      $("dataTitle").textContent = "Importieren";
      $("dataBtn").textContent = "Importieren";
      ta.value = ""; ta.readOnly = false;
      setHint("Füge hier den exportierten Code ein. Die Tabs auf diesem Gerät werden dadurch ersetzt.");
    }
    show($("dataSheet"));
    if (mode === "import") setTimeout(() => ta.focus(), 60);
  }
  $("dataBtn").onclick = async () => {
    const ta = $("dataText");
    if (dataMode === "export") {
      let ok = false;
      try { await navigator.clipboard.writeText(ta.value); ok = true; } catch (e) {}
      if (!ok) {
        ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
        try { ok = document.execCommand("copy"); } catch (e) {}
      }
      setHint(ok ? "Kopiert. Füge den Code jetzt in der anderen Tally-App ein."
                 : "Automatisches Kopieren geht hier nicht. Der Code ist markiert – tippe auf „Kopieren“.", !ok);
      return;
    }
    const d = parseCode(ta.value);
    if (!d) { setHint("Das ist kein gültiger Tally-Code. Kopiere ihn nochmal komplett.", true); return; }
    const total = d.tabs.reduce((a, t) => a + (Number(t.count) || 0), 0);
    confirmAction(d.tabs.length + " Tabs mit insgesamt " + total + " Strichen übernehmen? Die jetzigen Tabs auf diesem Gerät werden ersetzt.", "Importieren", () => {
      const tabs = d.tabs.map(t => ({
        id: String(t.id), name: String(t.name).slice(0, 40),
        count: Math.max(0, Math.floor(Number(t.count) || 0)),
        color: COLORS[t.color] ? t.color : "blue",
      }));
      state = { tabs, activeId: tabs.some(t => t.id === d.activeId) ? d.activeId : tabs[0].id, updatedAt: 0 };
      lastAdded = -1;
      commit();
    });
  };

  let confirmFn = null;
  function confirmAction(text, label, fn) {
    $("confirmText").textContent = text;
    $("confirmBtn").textContent = label;
    confirmFn = fn;
    show($("confirmSheet"));
  }
  $("confirmBtn").onclick = () => { const f = confirmFn; confirmFn = null; hide(); f && f(); };

  let nameMode = "new";
  let pickedColor = "blue";
  function renderColors() {
    const box = $("colors");
    box.textContent = "";
    Object.keys(COLORS).forEach(key => {
      const s = document.createElement("button");
      s.type = "button";
      s.className = "swatch" + (key === pickedColor ? " sel" : "");
      s.style.background = hexOf(key);
      s.setAttribute("aria-label", key);
      s.onclick = () => { pickedColor = key; renderColors(); };
      box.appendChild(s);
    });
  }
  function openName(mode) {
    nameMode = mode;
    if (mode === "new") {
      const used = state.tabs.map(t => t.color || "blue");
      pickedColor = Object.keys(COLORS).find(k => !used.includes(k)) || "blue";
    } else {
      pickedColor = active().color || "blue";
    }
    renderColors();
    $("nameTitle").textContent = mode === "new" ? "Neuer Tab" : "Bearbeiten";
    $("nameInput").value = mode === "new" ? "" : active().name;
    $("nameInput").placeholder = mode === "new" ? "Tab " + (state.tabs.length + 1) : "Name";
    $("nameDone").textContent = mode === "new" ? "Hinzufügen" : "Fertig";
    show($("nameSheet"));
    setTimeout(() => { const i = $("nameInput"); i.focus(); i.select(); }, 60);
  }
  $("nameForm").addEventListener("submit", (e) => {
    e.preventDefault();
    let name = $("nameInput").value.trim();
    if (nameMode === "new") {
      if (!name) name = "Tab " + (state.tabs.length + 1);
      const t = { id: uid(), name, count: 0, color: pickedColor };
      state.tabs.push(t);
      state.activeId = t.id;
      lastAdded = -1;
      hide(); commit();
      requestAnimationFrame(() => { const el = $("tabs"); el.scrollTo({ left: el.scrollWidth, behavior: "smooth" }); });
    } else {
      if (name) active().name = name;
      active().color = pickedColor;
      hide(); commit();
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hide(); });

  // ---------- Status ----------
  function setStatus(text, ok) {
    $("statusText").textContent = text;
    $("status").classList.toggle("ok", !!ok);
  }

  // ---------- Cloud-Speicher (dein Konto, privat) ----------
  let ref = null, writing = false, dirty = false, timer = null;

  function scheduleRemote() {
    if (!ref) return;
    dirty = true;
    setStatus("Wird gespeichert…", false);
    clearTimeout(timer);
    timer = setTimeout(flush, 450);
  }
  async function flush() {
    if (!ref || writing || !dirty) return;
    writing = true; dirty = false;
    try {
      await ref.set(clone(state));
      if (!dirty) setStatus("Gespeichert", true);
    } catch (e) {
      if (e && e.code === "unavailable") { dirty = true; setTimeout(flush, 800 + Math.random() * 800); }
      else setStatus("Nur auf diesem Gerät gespeichert", false);
    } finally {
      writing = false;
      if (dirty) { clearTimeout(timer); timer = setTimeout(flush, 300); }
    }
  }

  function applyRemote(data) {
    if (!valid(data)) return;
    if ((data.updatedAt || 0) <= (state.updatedAt || 0)) return;
    state = clone(data);
    if (!state.tabs.some(t => t.id === state.activeId)) state.activeId = state.tabs[0].id;
    lastAdded = -1;
    saveLocal();
    render();
  }

  async function connect() {
    if (STANDALONE) { setStatus("Auf diesem Gerät gespeichert", true); return; }
    if (!window.claude || typeof window.claude.use !== "function") {
      setStatus("Auf diesem Gerät gespeichert", true); return;
    }
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) {}
    const id = user ? await user.id().catch(() => null) : null;
    if (!db || !id) { setStatus("Auf diesem Gerät gespeichert", true); return; }

    const docRef = db.doc("data/users/" + id + "/geldzaehler");
    const loadTimer = setTimeout(() => setStatus("Cloud nicht erreichbar – lokal gespeichert", false), 10000);
    try {
      const snap = await docRef.get();
      clearTimeout(loadTimer);
      ref = docRef;
      const remote = snap.exists ? snap.data() : null;
      if (remote && valid(remote) && (remote.updatedAt || 0) > (state.updatedAt || 0)) {
        applyRemote(remote);
        setStatus("Gespeichert", true);
      } else if (state.updatedAt > ((remote && remote.updatedAt) || 0)) {
        scheduleRemote();
      } else {
        setStatus("Gespeichert", true);
      }
      // Live-Abgleich mit anderen Geräten
      docRef.onSnapshot((s) => {
        if (!s.exists || s.metadata.hasPendingWrites || writing || dirty) return;
        applyRemote(s.data());
      }, () => {});
    } catch (e) {
      clearTimeout(loadTimer);
      setStatus("Auf diesem Gerät gespeichert", true);
    }
  }

  darkMQ.addEventListener && darkMQ.addEventListener("change", render);

  // Sichtbare Höhe bestimmen. In der Claude-App auf dem iPhone ist das Fenster
  // der App höher als der sichtbare Bereich (die Leiste oben schiebt es nach unten).
  // Deshalb nie höher als Bildschirmhöhe minus Statusleiste und Claude-Leiste.
  function fitApp() {
    const ih = window.innerHeight;
    let avail = ih;
    const sh = (window.screen && screen.height) || 0;
    const portrait = !window.matchMedia || window.matchMedia("(orientation: portrait)").matches;
    if (!STANDALONE && sh > 0 && portrait) avail = Math.min(ih, sh - 120);
    avail = Math.max(420, Math.round(avail));
    const r = document.documentElement.style;
    r.setProperty("--app-h", avail + "px");
    r.setProperty("--hide-b", Math.max(0, ih - avail) + "px");
  }
  fitApp();
  window.addEventListener("resize", fitApp);

  // Wischen: nur die Strich-Tabelle scrollt hoch/runter, die Tab-Leiste nur seitwärts.
  // Alles andere bleibt stehen, damit die ganze Seite nicht mitwandert.
  let tStartX = 0, tStartY = 0;
  document.addEventListener("touchstart", (e) => {
    const t = e.touches[0]; tStartX = t.clientX; tStartY = t.clientY;
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (e.touches.length > 1) return;
    if (e.target.closest && e.target.closest("textarea")) return;
    const t = e.touches[0];
    const dx = t.clientX - tStartX, dy = t.clientY - tStartY;
    const tally = e.target.closest && e.target.closest(".tally");
    const tabs = e.target.closest && e.target.closest(".tabs");
    if (tabs && Math.abs(dx) > Math.abs(dy)) return;          // Tabs seitwärts: erlaubt
    if (tally && Math.abs(dy) >= Math.abs(dx)) {
      const canScroll = tally.scrollHeight > tally.clientHeight + 1;
      const atTop = tally.scrollTop <= 0;
      const atBottom = tally.scrollTop + tally.clientHeight >= tally.scrollHeight - 1;
      if (canScroll && !(atTop && dy > 0) && !(atBottom && dy < 0)) return; // Striche: erlaubt
    }
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  window.addEventListener("orientationchange", () => setTimeout(fitApp, 300));
  render();
  connect();
})();
</script>
</body>
</html>
